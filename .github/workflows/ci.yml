name: Shunkan CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test-linux:
    name: Build & Test (Linux Desktop & Core)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Tauri v2 on Linux needs webkit2gtk 4.1 and GTK 3; the rest is for
      # arboard, x11rb and the QUIC stack.
      - name: Install system dependencies (Tauri, Wayland, X11, OpenSSL)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libx11-dev libxcb1-dev \
            libxkbcommon-dev libwayland-dev libssl-dev cmake \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev

      - name: Cache Cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run full workspace test suite
        run: cargo test --workspace --all-targets --verbose

      # Asserts the project's stated numbers and prints what it measured, so
      # the run log carries a record rather than just a green tick.
      - name: Record budget measurements (INV-01, wire overhead)
        run: cargo test -p shunkan-core --test budgets -- --nocapture

      - name: Build release binaries
        run: cargo build --release --workspace --verbose

  frontend-dom:
    name: Palette DOM safety
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Renders hostile peer names and content hashes in a real browser and
      # asserts they stay inert text. A DOM stub cannot test this: the
      # behaviour under test is how the HTML parser treats attribute values.
      - name: Run palette DOM safety tests
        run: node desktop-linux/tests/run-dom-tests.mjs

  build-android:
    name: Build (Android native library & debug APK)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain & Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          local-cache: false

      - name: Cache Cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # This is the step the job was missing. It previously installed cargo-ndk
      # and never invoked it, never touched Gradle, and ran only `cargo check` —
      # which does not link, so it could not surface the NDK linker and ABI
      # problems that actually break Android builds.
      - name: Build libshunkan_core.so and generate Kotlin bindings
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: ./scripts/build-android.sh release

      - name: Verify the native library exists for every ABI
        run: |
          set -euo pipefail
          for abi in arm64-v8a x86_64; do
            lib="mobile-android/app/src/main/jniLibs/$abi/libshunkan_core.so"
            test -f "$lib" || { echo "missing $lib"; exit 1; }
            echo "ok: $lib ($(stat -c%s "$lib") bytes)"
          done
          test -f mobile-android/app/src/main/java/uniffi/shunkan_core/shunkan_core.kt

      - name: Build debug APK
        working-directory: mobile-android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: shunkan-debug-apk
          path: mobile-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
